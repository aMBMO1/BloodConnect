{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">🏥 Register as Hospital</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2">Register Hospital</button>
                </form>
                <hr/>
                <div class="text-center">
                    <p class="text-muted">Already have an account?
                        <a href="{% url 'core:login' %}" class="text-danger fw-bold">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
